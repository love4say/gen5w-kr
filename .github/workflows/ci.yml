name: Prepare official NX4HEV installer (temporary build branch)
on:
  push:
    branches:
      - build/hmgapi-rc7-nx4hev-usb-20261120
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact official HMG-API NEMESIS package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p USB_ROOT/packages
          curl -fL --retry 4 --retry-delay 2 'https://github.com/Open-HMG/HMG-API/releases/download/v1.1.0-rc.7/hmgapi-1.1.0-rc.7-nemesis-package.zip' -o USB_ROOT/packages/hmgapi.zip
          echo '16bea991f1c541acccea658f766971fac0b9d41caf34d6ca7523c9007fc41a63  USB_ROOT/packages/hmgapi.zip' | sha256sum -c -
          test "$(stat -c %s USB_ROOT/packages/hmgapi.zip)" = 832925
          unzip -p USB_ROOT/packages/hmgapi.zip NEMESIS.data | grep -q '^id=hmgapi$'
          printf '[nemesis]\nversion=1.1\ntype=list\n\n[package.0]\npath=packages/hmgapi.zip\nname=HMG-API\nshort-desc=HMG-API 1.1.0-rc.7 official NEMESIS installation\npublished=2026-11-20\n' > USB_ROOT/NEMESIS.data
          printf 'HMG-API 1.1.0-rc.7 official NEMESIS package, unmodified and SHA256-verified.\nOnly HMG-API, no upstream wireless mod.\nInstall before Korea Projection v10.\nNEMESIS >=1.16 required.\n' > USB_ROOT/README.txt
      - name: Export first-install USB contents
        uses: actions/upload-artifact@v4
        with:
          name: HMG-API-1.1.0-rc.7-first-install-USB
          path: USB_ROOT/
          retention-days: 7
          compression-level: 0
